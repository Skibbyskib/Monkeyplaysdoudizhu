<!--
  ============================================================================
  DOU DIZHU (斗地主 · Fight the Landlord) — single-file multiplayer web game
  ============================================================================
  • No backend, no accounts. Multiplayer is peer-to-peer via PeerJS (WebRTC).
  • The room creator's browser is the "host": it holds the authoritative game
    state, validates every move, and sends each player only what they may see
    (you never receive other players' hands).
  • Deploy: drop this one file on Netlify / Vercel / GitHub Pages / any static host.

  File layout (search for the banners):
    1. RULES ENGINE      – cards, combination detection, comparison
    2. MOVE GENERATOR    – hints + simple bot AI
    3. GAME STATE        – host-authoritative state machine (pure functions)
    4. NETWORKING        – PeerJS host/guest, reconnects, heartbeats
    5. UI                – rendering, hand selection, actions
    6. BOOT
  ============================================================================
-->

<style>
  :root { --cw: clamp(40px, min(10.5vw, 13dvh), 80px); }
  html, body { height: 100%; }
  body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  .felt {
    background:
      radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.08), transparent 60%),
      radial-gradient(ellipse at center, #047857 0%, #065f46 45%, #064e3b 100%);
  }

  /* ---------- Cards ---------- */
  .card {
    width: var(--cw); height: calc(var(--cw) * 1.4);
    border-radius: calc(var(--cw) * 0.12);
    background: linear-gradient(160deg, #ffffff 0%, #f4f4f5 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.18);
    border: 1px solid rgba(0,0,0,.12);
    position: relative; flex: none; user-select: none; -webkit-user-select: none;
    transition: transform .14s ease, box-shadow .14s ease;
  }
  .card .idx {
    position: absolute; top: 4%; left: 6%;
    display: flex; flex-direction: column; align-items: center;
    line-height: .95; font-weight: 800; font-size: calc(var(--cw) * .3);
    letter-spacing: -.04em;
  }
  .card .idx .s { font-size: calc(var(--cw) * .25); }
  .card .pip { position: absolute; right: 8%; bottom: 5%; font-size: calc(var(--cw) * .5); line-height: 1; }
  .card.red { color: #dc2626; }
  .card.black { color: #18181b; }
  .card.joker .idx {
    writing-mode: vertical-rl; text-orientation: upright;
    font-size: calc(var(--cw) * .17); letter-spacing: -.12em; top: 6%;
  }
  .card.joker .pip { font-size: calc(var(--cw) * .55); }
  .card.joker.black .pip { color: #3f3f46; }

  .card.sm { --cw: clamp(26px, min(6.6vw, 8dvh), 46px); }
  .card.xs { --cw: 22px; }
  .stack > .card + .card { margin-left: calc(var(--cw) * -0.58); }
  .stack.loose > .card + .card { margin-left: calc(var(--cw) * -0.45); }

  .card-back {
    width: var(--cw); height: calc(var(--cw) * 1.4);
    border-radius: calc(var(--cw) * 0.12); flex: none;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 4px, transparent 4px 9px),
      linear-gradient(135deg, #b91c1c, #7f1d1d);
    border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  .card-back.sm { --cw: clamp(26px, min(6.6vw, 8dvh), 46px); }
  .mini-back {
    width: 11px; height: 15px; border-radius: 2px; display: inline-block;
    background: linear-gradient(135deg, #dc2626, #7f1d1d); border: 1px solid #fff;
  }

  /* Hand */
  #hand { display: flex; justify-content: center; touch-action: none; padding-top: calc(var(--cw) * .32); }
  #hand .card { cursor: pointer; }
  #hand .card.sel { transform: translateY(calc(var(--cw) * -0.3)); box-shadow: 0 0 0 3px #f59e0b, 0 8px 18px rgba(0,0,0,.35); }
  #hand .card.fresh::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 0 0 3px #38bdf8; pointer-events: none;
  }
  @media (hover: hover) { #hand .card:not(.sel):hover { transform: translateY(calc(var(--cw) * -0.08)); } }

  /* Animations */
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.85); } to { opacity: 1; transform: none; } }
  .pop > * { animation: pop .32s cubic-bezier(.2,.9,.3,1.2) both; }
  .pop-self { animation: pop .32s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,.75); } 50% { box-shadow: 0 0 0 9px rgba(251,191,36,0); } }
  .turn-glow { animation: glow 1.4s ease-in-out infinite; }
  @keyframes dots { 0%,20% { opacity: .2; } 50% { opacity: 1; } 100% { opacity: .2; } }
  .dots span { animation: dots 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  .toast { animation: toastIn .25s ease-out both; }
  .safe-b { padding-bottom: max(env(safe-area-inset-bottom), 6px); }
</style>
</head>

<body class="bg-slate-950 text-slate-100 antialiased">
<div id="app"></div>
<div id="toasts" class="fixed top-2 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none w-[92%] max-w-sm"></div>

<script>

   1. RULES ENGINE

/* ============================================================================

/** All legal moves, weakest first: [{ids, combo}] */

    hands: [[], [], []], kitty: [], bids: [null, null, null], bidStart: -1, bidTurn: -1,
    highestBid: 0, highestBidder: -1, bidCount: 0, landlord: -1, baseBid: 0, turn: -1,
    lastPlay: null, lastActions: [null, null, null], bombs: 0, plays: [0, 0, 0], played: [], result: null

}

  S.kitty = sortDesc(deck.slice(51));

    phase: 'bidding', bids: [null, null, null], highestBid: 0, highestBidder: -1, bidCount: 0,
    landlord: -1, baseBid: 0, turn: -1, lastPlay: null, lastActions: [null, null, null],

  dealRound(S);

      return null;

  const mult = S.baseBid * Math.pow(2, S.bombs) * (spring ? 2 : 1);
  const deltas = [0, 1, 2].map(s => (s === S.landlord ? (llWin ? 2 : -2) : (llWin ? -1 : 1)) * mult);
  deltas.forEach((d, s) => { S.players[s].score += d; });
  S.result = { llWin, winner: seat, spring, mult, deltas };
  S.phase = 'ended'; S.turn = -1;
  addLog(S, `${llWin ? '👑 The Landlord' : '🌾 The Peasants'} won round ${S.round}${spring ? ' — Spring! ×2' : ''}`);
}

/** What one seat is allowed to see. */
function viewFor(S, seat) {
  const ended = S.phase === 'ended';
  return {
    code: S.code, phase: S.phase, me: seat, round: S.round,
    players: S.players.map(p => ({ name: p.name, connected: p.connected, bot: p.bot, score: p.score, host: p.cid === S.hostCid })),
    hand: seat >= 0 && S.hands[seat] ? S.hands[seat] : [],
    counts: S.hands.map(h => h.length),
    kitty: S.landlord >= 0 ? S.kitty : null,
    hands: ended ? S.hands : null,
    bidTurn: S.bidTurn, highestBid: S.highestBid, highestBidder: S.highestBidder,
    landlord: S.landlord, baseBid: S.baseBid, turn: S.turn,
    lastPlay: S.lastPlay ? { seat: S.lastPlay.seat, combos: S.lastPlay.combos } : null,
    lastActions: S.lastActions, bombs: S.bombs, plays: S.plays, result: S.result, log: S.log.slice(-8)
  };
}

/* ============================================================================
   4. NETWORKING (PeerJS / WebRTC)
   The host registers the PeerJS id PEER_PREFIX+ROOM. Guests connect to it.
   To use your own PeerServer, define window.DDZ_PEER_OPTIONS before this script,
   e.g. { host: 'my-peer.example.com', port: 443, secure: true, path: '/' }.
   ========================================================================== */
const PEER_PREFIX = 'ddz-fightlandlord-v1-';
const PEER_OPTIONS = Object.assign({ debug: 1 }, window.DDZ_PEER_OPTIONS || {});

/* ---- Optional TURN relay (fixes mobile data / strict networks) ----
   Fill in app + key from your free Metered "Open Relay" dashboard. Leave blank to turn it off. */
window.DDZ_TURN = window.DDZ_TURN || { app: 'monkeydoudizhugame', key: '93d18437c791995863098bb53af0bdbccf91' };
const ICE_STUN = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }];
const iceReady = (window.DDZ_TURN.app && window.DDZ_TURN.key)
  ? Promise.race([
      fetch('https://' + window.DDZ_TURN.app + '.metered.live/api/v1/turn/credentials?apiKey=' + encodeURIComponent(window.DDZ_TURN.key))
        .then(r => (r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
        .then(list => { if (Array.isArray(list) && list.length) PEER_OPTIONS.config = { iceServers: ICE_STUN.concat(list) }; })
        .catch(e => console.warn('[turn] could not get relay credentials; playing without relay', e)),
      new Promise(res => setTimeout(res, 3000))
    ])
  : Promise.resolve();
const HOST_KEY = code => 'ddz_host_' + code;

const params = new URLSearchParams(location.search);
let roomCode = (params.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
const hadCid = !!sessionStorage.getItem('ddz_cid');
let myCid = sessionStorage.getItem('ddz_cid') || ('c-' + rid(12));
sessionStorage.setItem('ddz_cid', myCid);
let myName = localStorage.getItem('ddz_name') || '';

let role = null;        // 'host' | 'guest'
let peer = null;
let S = null;           // host only: authoritative state
let V = null;           // everyone: my current view
const conns = new Map();// host only: peerId -> { conn, cid, seen }
let hostConn = null, reconnectTimer = null, lastPong = 0, rejected = false, botTimer = null;

function saveHost() {
  try { localStorage.setItem(HOST_KEY(S.code), JSON.stringify({ cid: myCid, state: S, savedAt: Date.now() })); } catch (e) {}
}
function loadHost(code) {
  try {
    const r = JSON.parse(localStorage.getItem(HOST_KEY(code)) || 'null');
    if (r && Date.now() - r.savedAt < 12 * 3600e3) return r;
  } catch (e) {}
  return null;
}

/* ---------- Host ---------- */
function startHost(code, state, opts = {}) {
  role = 'host'; roomCode = code; S = state; S.hostCid = myCid; S.code = code;
  S.players.forEach(p => {
    if (p.cid === myCid) { p.connected = true; if (myName) p.name = myName; }
    else if (!p.bot || !p.connected) p.connected = false;
  });
  if (S.phase === 'lobby') S.players = S.players.filter(p => p.cid === myCid || p.bot);
  setStatus('Opening your room…');
  let tries = 0;
  const open = () => {
    peer = new Peer(PEER_PREFIX + roomCode, PEER_OPTIONS);
    peer.on('open', () => { setStatus(''); commit(); });
    peer.on('connection', setupHostConn);
    peer.on('disconnected', () => setTimeout(() => { if (peer && !peer.destroyed && peer.disconnected) try { peer.reconnect(); } catch (e) {} }, 1500));
    peer.on('error', err => {
      console.warn('[peer]', err.type, err);
      if (err.type === 'unavailable-id') {
        peer.destroy(); tries++;
        if (opts.fresh) {                    // brand-new room collided with an existing code
          roomCode = rid(6); S.code = roomCode;
          history.replaceState(null, '', '?room=' + roomCode);
          return open();
        }
        if (opts.fallbackToGuest && tries >= 3) {   // another tab is already hosting → join as guest
          myCid = 'c-' + rid(12); sessionStorage.setItem('ddz_cid', myCid);
          S = null; role = null;
          return myName ? startGuest(roomCode) : (ui.screen = 'join', render());
        }
        setStatus(`Re-opening room ${roomCode}… (${tries})`);
        return setTimeout(open, 2500);
      }
      if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type))
        setStatus('Lost the connection to the matchmaking server — retrying…');
    });
  };
  open();
  setInterval(() => {   // heartbeat: drop guests we haven't heard from
    const now = Date.now();
    for (const [pid, e] of conns) if (now - e.seen > 15000) { try { e.conn.close(); } catch (x) {} dropConn(pid); }
    if (peer && !peer.destroyed && peer.disconnected) try { peer.reconnect(); } catch (x) {}
    else if (peer && peer.open && ui.status.startsWith('Lost')) setStatus('');
  }, 4000);
}
function setupHostConn(conn) {
  conns.set(conn.peer, { conn, cid: null, seen: Date.now() });
  conn.on('data', d => onHostData(conn, d));
  conn.on('close', () => dropConn(conn.peer));
  conn.on('error', () => dropConn(conn.peer));
}
function onHostData(conn, d) {
  const e = conns.get(conn.peer);
  if (!e || !d) return;
  e.seen = Date.now();
  if (d.t === 'hello') {
    for (const [pid, x] of conns) if (pid !== conn.peer && x.cid === d.cid) { conns.delete(pid); try { x.conn.close(); } catch (z) {} }
    const r = joinPlayer(S, String(d.cid).slice(0, 40), cleanName(d.name));
    if (r.error) { conn.send({ t: 'reject', reason: r.error }); setTimeout(() => conn.close(), 600); return; }
    e.cid = d.cid;
    commit();
  } else if (d.t === 'action') {
    if (!e.cid) return;
    const err = doAction(e.cid, d.a);
    if (err) conn.send({ t: 'error', msg: err });
  } else if (d.t === 'ping') conn.send({ t: 'pong' });
}
function dropConn(pid) {
  const e = conns.get(pid);
  if (!e) return;
  conns.delete(pid);
  if (e.cid && ![...conns.values()].some(x => x.cid === e.cid)) { leavePlayer(S, e.cid); commit(); }
}
function doAction(cid, a) {
  const seat = S.players.findIndex(p => p.cid === cid);
  if (seat < 0) return 'You are not seated in this room.';
  const err = applyAction(S, seat, a);
  if (!err) commit();
  return err;
}
function commit() {
  saveHost();
  for (const e of conns.values()) {
    if (!e.cid || !e.conn.open) continue;
    const seat = S.players.findIndex(p => p.cid === e.cid);
    if (seat >= 0) e.conn.send({ t: 'state', v: viewFor(S, seat) });
  }
  V = viewFor(S, S.players.findIndex(p => p.cid === myCid));
  onView();
  scheduleBot();
}
function scheduleBot() {
  clearTimeout(botTimer);
  const seat = S.phase === 'bidding' ? S.bidTurn : S.phase === 'playing' ? S.turn : -1;
  if (seat < 0 || !S.players[seat] || !S.players[seat].bot) return;
  const act = S.act, phase = S.phase;
  botTimer = setTimeout(() => {
    if (S.act !== act || S.phase !== phase) return;
    let a;
    if (S.phase === 'bidding') a = { type: 'bid', value: botBid(S.hands[seat], S.highestBid) };
    else { const ids = botPlay(S, seat); a = ids ? { type: 'play', ids } : { type: 'pass' }; }
    let err = applyAction(S, seat, a);
    if (err && S.phase === 'playing') err = applyAction(S, seat, S.lastPlay ? { type: 'pass' } : { type: 'play', ids: [sortAsc(S.hands[seat])[0]] });
    if (err) console.warn('bot error', err);
    commit();
  }, 700 + Math.random() * 700);
}

/* ---------- Guest ---------- */
function startGuest(code) {
  role = 'guest'; roomCode = code;
  setStatus(`Joining room ${code}…`);
  peer = new Peer(PEER_OPTIONS);
  peer.on('open', connectToHost);
  peer.on('disconnected', () => setTimeout(() => { if (peer && !peer.destroyed && peer.disconnected) try { peer.reconnect(); } catch (e) {} }, 1500));
  peer.on('error', err => {
    console.warn('[peer]', err.type, err);
    if (err.type === 'peer-unavailable') {
      setStatus(V ? 'Host went offline — waiting for them to come back…' : `Can't reach room ${code} yet. Is the host's page open? Retrying…`);
      hostConn = null; scheduleReconnect(3000);
    } else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) {
      setStatus('Lost the connection to the matchmaking server — retrying…'); scheduleReconnect(3000);
    }
  });
  setInterval(() => {
    if (rejected) return;
    if (hostConn && hostConn.open) {
      hostConn.send({ t: 'ping' });
      if (Date.now() - lastPong > 12000) { try { hostConn.close(); } catch (e) {} hostConn = null; setStatus('Connection lost — reconnecting…'); scheduleReconnect(500); }
    }
  }, 4000);
}
function scheduleReconnect(ms) {
  if (reconnectTimer || rejected) return;
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connectToHost(); }, ms);
}
function connectToHost() {
  if (!peer || peer.destroyed || rejected) return;
  if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} return scheduleReconnect(2500); }
  if (hostConn) { const old = hostConn; hostConn = null; try { old.close(); } catch (e) {} }
  const c = peer.connect(PEER_PREFIX + roomCode, { reliable: true });
  hostConn = c;
  c.on('open', () => { lastPong = Date.now(); c.send({ t: 'hello', cid: myCid, name: myName }); });
  c.on('data', d => {
    if (c !== hostConn || !d) return;
    lastPong = Date.now();
    if (d.t === 'state') { V = d.v; if (ui.status) setStatus('', true); onView(); }
    else if (d.t === 'error') toast(d.msg, 'err');
    else if (d.t === 'reject') { rejected = true; ui.screen = 'rejected'; ui.status = d.reason; V = null; render(); }
  });
  const lost = () => { if (c !== hostConn || rejected) return; hostConn = null; setStatus('Connection lost — reconnecting…'); scheduleReconnect(2000); };
  c.on('close', lost); c.on('error', lost);
  setTimeout(() => { if (c === hostConn && !c.open) { lost(); } }, 10000);
}

function send(a) {
  if (role === 'host') { const err = doAction(myCid, a); if (err) toast(err, 'err'); }
  else if (hostConn && hostConn.open) hostConn.send({ t: 'action', a });
  else toast('Not connected right now — reconnecting…', 'err');
}

    (kind === 'err' ? 'bg-rose-600/95 text-white' : 'bg-slate-800/95 text-slate-50 ring-1 ring-white/10');

function onView() {
  if (!V) return render();

  if (ui.lastLog >= 0) for (const l of V.log) if (l.id > ui.lastLog) toast(l.text);
  ui.lastLog = maxLog;
  if (V.result && ui.resultRound !== V.round) { ui.resultRound = V.round; ui.resultHidden = false; }
  ui.screen = 'room';
  render();
}

      </div>
      <div class="bg-slate-900/85 backdrop-blur rounded-2xl p-4 ring-1 ring-white/10 shadow-xl space-y-2">
        <div class="flex justify-between items-center mb-1"><span class="font-semibold">Players</span><span class="text-sm text-slate-400">${V.players.length}/3</span></div>
        ${seats}
      </div>
      ${iAmHost
        ? `<button data-act="start" ${full ? '' : 'disabled'} class="w-full py-4 rounded-2xl font-extrabold text-lg shadow-lg transition ${full ? 'bg-amber-400 hover:bg-amber-300 text-slate-900 shadow-amber-500/25' : 'bg-slate-700 text-slate-400 cursor-not-allowed'}">${full ? '▶ Start game' : `Waiting for ${3 - V.players.length} more…`}</button>
           ${!full ? `<p class="text-center text-xs text-emerald-100/70">Short on friends? Fill empty seats with bots.</p>` : ''}`
        : `<div class="text-center py-4 text-emerald-50/90">${full ? 'Everyone is here. Waiting for the host to start' : 'Waiting for more players'}<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>`}
      <div class="text-center"><button data-act="leave" class="text-sm text-emerald-100/60 hover:text-white underline">Leave room</button></div>
    </div>
  </div>`;
}

const AV_COLORS = ['from-sky-400 to-indigo-500', 'from-pink-400 to-rose-500', 'from-lime-400 to-emerald-500'];
function avatarHTML(p, seat, size) {
  const ch = p.bot ? '🤖' : esc([...p.name.trim()][0] || '?').toUpperCase();
  return `<div class="${size} shrink-0 rounded-full bg-gradient-to-br ${AV_COLORS[seat % 3]} grid place-items-center font-black text-white shadow-md">${ch}</div>`;
}

function actionHTML(seat, align) {
  const isTurn = (V.phase === 'bidding' && V.bidTurn === seat) || (V.phase === 'playing' && V.turn === seat);
  const p = V.players[seat];
  if (isTurn) {
    const txt = p && !p.connected && !p.bot ? 'Waiting for reconnect' : seat === V.me ? '' : 'Thinking';
    return txt ? `<div class="px-3 py-1 rounded-full bg-black/30 text-amber-200 text-sm font-semibold">${txt}<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>` : '';
  }
  const a = V.lastActions && V.lastActions[seat];
  if (!a) return '';
  const fresh = ui.animSeen[seat] !== a.act;
  ui.animSeen[seat] = a.act;
  if (a.type === 'pass') return `<div class="${fresh ? 'pop-self' : ''} px-4 py-1 rounded-full bg-slate-900/60 text-slate-200 font-bold text-sm ring-1 ring-white/10">Pass</div>`;
  if (a.type === 'bid') return `<div class="${fresh ? 'pop-self' : ''} px-4 py-1 rounded-full font-bold text-sm ${a.value ? 'bg-amber-400 text-slate-900' : 'bg-slate-900/60 text-slate-300 ring-1 ring-white/10'}">${a.value ? `Bid ${a.value}` : 'No bid'}</div>`;
  return `<div class="flex flex-col ${align === 'end' ? 'items-end' : align === 'start' ? 'items-start' : 'items-center'} gap-1">
    <div class="stack flex flex-wrap ${align === 'end' ? 'justify-end' : align === 'start' ? 'justify-start' : 'justify-center'} ${fresh ? 'pop' : ''}">${a.ids.map(id => cardHTML(id, 'sm')).join('')}</div>
    <div class="text-[11px] font-semibold uppercase tracking-wide text-emerald-100/80">${esc(a.name)}</div></div>`;
}

function opponentHTML(seat, side) {
  const p = V.players[seat];
  if (!p) return '';
  const isTurn = (V.phase === 'bidding' && V.bidTurn === seat) || (V.phase === 'playing' && V.turn === seat);
  const ll = V.landlord === seat;
  const n = V.counts[seat];
  return `
  <div class="flex flex-col items-center gap-1 w-[78px] sm:w-28 text-center">
    <div class="relative">
      <div class="rounded-full ${isTurn ? 'ring-4 ring-amber-400 turn-glow' : 'ring-2 ring-white/20'}">${avatarHTML(p, seat, 'w-12 h-12 sm:w-16 sm:h-16 text-xl sm:text-2xl')}</div>
      ${ll ? '<span class="absolute -top-3 -right-2 text-2xl drop-shadow" title="Landlord">👑</span>' : ''}
      ${!p.connected && !p.bot ? '<span class="absolute -bottom-1 -right-1 text-[10px] px-1.5 rounded bg-rose-600 font-bold">OFF</span>' : ''}
    </div>
    <div class="text-xs sm:text-sm font-semibold truncate max-w-full">${esc(p.name)}</div>
    <div class="flex items-center gap-1.5 bg-black/35 rounded-full px-2.5 py-0.5 ${n <= 2 && V.phase === 'playing' ? 'ring-2 ring-rose-400 text-rose-200' : ''}">
      <span class="mini-back"></span><b class="text-base leading-none">${n}</b>
    </div>
    <div class="text-[10px] sm:text-xs text-emerald-100/80">${V.landlord < 0 ? '' : ll ? 'Landlord · ' : 'Peasant · '}${p.score} pts</div>
    ${role === 'host' && !p.connected && !p.bot && V.phase !== 'ended' ? `<button data-act="takeover" data-arg="${seat}" class="mt-1 text-[10px] px-2 py-1 rounded bg-slate-900/70 ring-1 ring-white/20 hover:bg-slate-800">🤖 Let a bot play</button>` : ''}
  </div>`;
}

function tableHTML() {
  const me = V.me, right = (me + 1) % 3, left = (me + 2) % 3;
  const myP = V.players[me];
  const stake = V.landlord >= 0 ? V.baseBid * Math.pow(2, V.bombs) : Math.max(V.highestBid, 1) * Math.pow(2, V.bombs);
  const myTurn = (V.phase === 'bidding' && V.bidTurn === me) || (V.phase === 'playing' && V.turn === me);
  const kitty = V.kitty
    ? `<div class="flex flex-col items-center gap-1"><div class="flex gap-1 ${ui.animSeen.kitty !== V.round ? 'pop' : ''}">${V.kitty.map(id => cardHTML(id, 'sm')).join('')}</div><div class="text-[10px] uppercase tracking-wider text-emerald-100/70">Landlord's cards</div></div>`
    : `<div class="flex flex-col items-center gap-1"><div class="flex gap-1"><div class="card-back sm"></div><div class="card-back sm"></div><div class="card-back sm"></div></div><div class="text-[10px] uppercase tracking-wider text-emerald-100/70">Hidden cards</div></div>`;
  if (V.kitty) ui.animSeen.kitty = V.round;

  let center = '';
  if (V.phase === 'bidding') center = V.highestBid ? `Current bid: <b class="text-amber-300">${V.highestBid}</b> by ${esc(V.players[V.highestBidder].name)}` : 'Bidding: who wants to be the Landlord?';
  else if (V.phase === 'playing' && V.turn === me && !V.lastPlay) center = '<b class="text-amber-300">Your lead</b>: play any combination';

  return `
  <div class="h-[100dvh] flex flex-col felt overflow-hidden select-none">
    <header class="flex items-center gap-2 px-2 sm:px-4 py-2 bg-black/25 text-xs sm:text-sm">
      <button data-act="leave" class="px-2 py-1 rounded-lg hover:bg-white/10" title="Leave">✕</button>
      <button data-act="copy" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/15" title="Copy invite link">
        <span class="text-emerald-100/70">Room</span><b class="tracking-widest text-amber-300">${esc(V.code)}</b><span>🔗</span>
      </button>
      <div class="ml-auto flex items-center gap-1.5 sm:gap-2">
        <span class="hidden sm:inline px-2 py-1 rounded-lg bg-white/10">Round ${V.round}</span>
        ${V.bombs ? `<span class="px-2 py-1 rounded-lg bg-white/10">💣×${V.bombs}</span>` : ''}
        <span class="px-2 py-1 rounded-lg bg-amber-400 text-slate-900 font-bold" title="Current stakes">×${stake}</span>
        <span class="px-2 py-1 rounded-lg bg-white/10">${myP.score} pts</span>
      </div>
    </header>

    <main class="relative flex-1 min-h-0">
      <div class="absolute left-2 top-2 z-10">${opponentHTML(left)}</div>
      <div class="absolute right-2 top-2 z-10">${opponentHTML(right)}</div>
      <div class="absolute left-1/2 -translate-x-1/2 top-2">${kitty}</div>
      <div class="absolute left-2 sm:left-32 top-[50%] sm:top-[34%] max-w-[48%] sm:max-w-[38%]">${actionHTML(left, 'start')}</div>
      <div class="absolute right-2 sm:right-32 top-[50%] sm:top-[34%] max-w-[48%] sm:max-w-[38%] flex justify-end">${actionHTML(right, 'end')}</div>
      <div class="absolute inset-x-0 bottom-1 flex flex-col items-center gap-2 px-2">
        ${center ? `<div class="text-sm text-emerald-50 bg-black/25 px-3 py-1 rounded-full">${center}</div>` : ''}
        ${actionHTML(me, 'center')}
      </div>
    </main>

    <section class="relative bg-gradient-to-t from-black/50 to-black/10 pt-1 safe-b">
      <div id="selinfo" class="absolute -top-7 right-2 sm:right-4 pointer-events-none">${selInfoHTML()}</div>
      <div class="flex items-center justify-between gap-2 px-2 sm:px-4">
        <div class="flex items-center gap-2 min-w-0">
          <div class="relative rounded-full ${myTurn ? 'ring-4 ring-amber-400 turn-glow' : 'ring-2 ring-white/20'}">${avatarHTML(myP, me, 'w-9 h-9 text-base')}
            ${V.landlord === me ? '<span class="absolute -top-3 -right-2 text-xl">👑</span>' : ''}</div>
          <div class="leading-tight min-w-0"><div class="text-sm font-semibold truncate">${esc(myP.name)}</div>
            <div class="text-[11px] text-emerald-100/70">${V.landlord < 0 ? `${V.hand.length} cards` : V.landlord === me ? 'Landlord' : 'Peasant'}</div></div>
        </div>
        <div id="actions" class="flex items-center gap-1.5 sm:gap-2 justify-end">${actionsHTML()}</div>
      </div>
      <div id="hand" class="px-1 sm:px-4 pb-1">${handHTML()}</div>
    </section>
    ${V.phase === 'ended' ? resultHTML() : ''}
  </div>`;
}

function handHTML() {
  const fresh = V.landlord === V.me && V.kitty && V.plays && V.plays[V.me] === 0 ? new Set(V.kitty) : null;
  return V.hand.map(id => cardHTML(id, (ui.selected.has(id) ? 'sel ' : '') + (fresh && fresh.has(id) ? 'fresh' : ''))).join('');
}

function selectionInfo() {
  const ids = [...ui.selected];
  if (!ids.length) return { ok: false, label: '' };
  const all = analyze(ids);
  if (!all.length) return { ok: false, label: 'Not a valid combination' };
  if (!V.lastPlay) return { ok: true, label: COMBO_NAME[all[0].type] };
  const m = all.filter(a => V.lastPlay.combos.some(b => beats(a, b)));
  return m.length ? { ok: true, label: COMBO_NAME[m[0].type] } : { ok: false, label: `${COMBO_NAME[all[0].type]} doesn't beat it` };
}

function selInfoHTML() {
  if (!V || V.phase !== 'playing' || !ui.selected.size) return '';
  const info = selectionInfo();
  return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold shadow ${info.ok ? 'bg-emerald-500 text-white' : 'bg-rose-600 text-white'}">${info.ok ? '✓ ' : ''}${esc(info.label)}</span>`;
}

const btn = (act, label, cls, dis = false, arg = '') =>
  `<button data-act="${act}" ${arg !== '' ? `data-arg="${arg}"` : ''} ${dis ? 'disabled' : ''} class="px-3 sm:px-5 py-2 rounded-xl font-bold text-sm sm:text-base shadow transition active:scale-95 ${dis ? 'bg-slate-700/80 text-slate-400 cursor-not-allowed' : cls}">${label}</button>`;

function actionsHTML() {
  if (!V) return '';
  const me = V.me;
  if (V.phase === 'bidding') {
    if (V.bidTurn !== me) return `<span class="text-xs sm:text-sm text-emerald-100/80">${esc(V.players[V.bidTurn]?.name)} is bidding…</span>`;
    return btn('bid', 'No bid', 'bg-slate-200 text-slate-900 hover:bg-white', false, 0) +
      [1, 2, 3].map(v => btn('bid', `${v}`, 'bg-amber-400 text-slate-900 hover:bg-amber-300 min-w-[44px]', v <= V.highestBid, v)).join('');
  }
  if (V.phase === 'playing') {
    const info = selectionInfo();
    const label = '';
    if (V.turn !== me) {
      return `${label}<span class="text-xs sm:text-sm text-emerald-100/80">${esc(V.players[V.turn]?.name)}'s turn</span>` +
        (ui.selected.size ? btn('clear', 'Clear', 'bg-white/10 hover:bg-white/20 text-white') : '');
    }
    const leading = !V.lastPlay;
    return `${label}` +
      btn('pass', 'Pass', 'bg-slate-200 text-slate-900 hover:bg-white', leading) +
      btn('hint', 'Hint', 'bg-sky-500 text-white hover:bg-sky-400') +
      btn('play', 'Play', 'bg-amber-400 text-slate-900 hover:bg-amber-300', !info.ok);
  }
  return '';
}

function resultHTML() {
  const r = V.result;
  if (!r) return '';
  if (ui.resultHidden) return `<button data-act="showResult" class="fixed bottom-40 left-1/2 -translate-x-1/2 z-30 px-4 py-2 rounded-full bg-amber-400 text-slate-900 font-bold shadow-lg">Show results</button>`;
  const meLL = V.me === V.landlord;
  const iWon = r.llWin === meLL;
  const rows = [0, 1, 2].map(s => {
    const p = V.players[s], d = r.deltas[s];
    const left = V.hands ? V.hands[s] : [];
    return `<div class="flex items-center gap-3 py-2 border-t border-white/10">
      ${avatarHTML(p, s, 'w-9 h-9 text-sm')}
      <div class="flex-1 min-w-0 text-left">
        <div class="font-semibold truncate">${esc(p.name)} ${s === V.landlord ? '👑' : ''}${s === V.me ? ' <span class="text-xs text-amber-300">(you)</span>' : ''}</div>
        <div class="mt-1">${left.length ? stackHTML(left, 'xs', 'loose') : '<span class="text-xs text-emerald-300 font-semibold">Out of cards!</span>'}</div>
      </div>
      <div class="text-right"><div class="font-black text-lg ${d > 0 ? 'text-emerald-400' : 'text-rose-400'}">${d > 0 ? '+' : ''}${d}</div><div class="text-xs text-slate-400">${p.score} total</div></div>
    </div>`;
  }).join('');
  return `
  <div class="fixed inset-0 z-30 bg-black/60 backdrop-blur-sm grid place-items-center p-4">
    <div class="pop-self w-full max-w-md bg-slate-900 rounded-3xl p-5 sm:p-6 shadow-2xl ring-1 ring-white/10 text-center max-h-[92dvh] overflow-auto">
      <div class="text-5xl">${iWon ? '🎉' : '😵'}</div>
      <h2 class="text-2xl font-black mt-1">${r.llWin ? 'The Landlord wins!' : 'The Peasants win!'}</h2>
      <p class="${iWon ? 'text-emerald-300' : 'text-rose-300'} font-semibold">${iWon ? 'You won this round' : 'You lost this round'}</p>
      <div class="flex flex-wrap justify-center gap-1.5 my-3 text-xs">
        <span class="px-2 py-1 rounded-lg bg-white/10">Bid ${V.baseBid}</span>
        ${V.bombs ? `<span class="px-2 py-1 rounded-lg bg-white/10">💣 ×${Math.pow(2, V.bombs)}</span>` : ''}
        ${r.spring ? `<span class="px-2 py-1 rounded-lg bg-pink-500/30">🌸 Spring ×2</span>` : ''}
        <span class="px-2 py-1 rounded-lg bg-amber-400 text-slate-900 font-bold">= ×${r.mult}</span>
      </div>
      <div class="text-left">${rows}</div>
      <div class="mt-4 flex gap-2">
        <button data-act="hideResult" class="px-4 py-3 rounded-xl bg-white/10 hover:bg-white/15 font-semibold">View table</button>
        ${role === 'host'
          ? `<button data-act="next" class="flex-1 py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-900 font-extrabold">Next round →</button>`
          : `<div class="flex-1 py-3 rounded-xl bg-white/5 text-slate-300 text-sm grid place-items-center">Waiting for host<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>`}
      </div>
    </div>
  </div>`;
}

/* ---------- Hand layout & selection ---------- */
function layoutHand() {
  const el = $('hand');
  if (!el) return;
  const cards = el.querySelectorAll('.card');
  const n = cards.length;
  if (!n) return;
  const W = el.clientWidth - 12, cw = cards[0].offsetWidth;
  const step = n > 1 ? Math.min(cw * 0.62, (W - cw) / (n - 1)) : 0;
  cards.forEach((c, i) => { c.style.marginLeft = i === 0 ? '0px' : (step - cw) + 'px'; });
}
function refreshSelection() {
  document.querySelectorAll('#hand .card').forEach(c => c.classList.toggle('sel', ui.selected.has(+c.dataset.card)));
  const a = $('actions'); if (a) a.innerHTML = actionsHTML();
  const si = $('selinfo'); if (si) si.innerHTML = selInfoHTML();
}
let drag = null;
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('#hand .card');
  if (!c || !V) return;
  e.preventDefault();
  const id = +c.dataset.card;
  drag = { add: !ui.selected.has(id), seen: new Set([id]) };
  drag.add ? ui.selected.add(id) : ui.selected.delete(id);
  refreshSelection();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const t = document.elementFromPoint(e.clientX, e.clientY);
  const c = t && t.closest('#hand .card');
  if (!c) return;
  const id = +c.dataset.card;
  if (drag.seen.has(id)) return;
  drag.seen.add(id);
  drag.add ? ui.selected.add(id) : ui.selected.delete(id);
  refreshSelection();
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { drag = null; }));
window.addEventListener('resize', layoutHand);

/* ---------- Actions ---------- */
async function copyLink() {
  const url = roomUrl();
  try { await navigator.clipboard.writeText(url); toast('Invite link copied. Send it to your friends!'); }
  catch (e) { window.prompt('Copy this link and send it to your friends:', url); }
}
const handlers = {
  home: () => { location.href = location.pathname; },
  copy: copyLink,
  share: () => navigator.share({ title: 'Play Dou Dizhu with me!', text: 'Join my Fight the Landlord room 🃏', url: roomUrl() }).catch(() => {}),
  leave: () => {
    const inGame = V && V.phase !== 'lobby';
    if (role === 'host' && !confirm(inGame ? 'Leaving closes the room for everyone. Leave?' : 'Close this room?')) return;
    if (role === 'guest' && inGame && !confirm('Leave this game?')) return;
    if (role === 'host') localStorage.removeItem(HOST_KEY(roomCode));
    try { peer && peer.destroy(); } catch (e) {}
    location.href = location.pathname;
  },
  addBot: () => send({ type: 'addBot' }),
  kick: s => send({ type: 'kick', seat: +s }),
  start: () => send({ type: 'start' }),
  next: () => send({ type: 'next' }),
  takeover: s => send({ type: 'takeover', seat: +s }),
  bid: v => send({ type: 'bid', value: +v }),
  pass: () => { ui.selected.clear(); send({ type: 'pass' }); },
  clear: () => { ui.selected.clear(); refreshSelection(); },
  play: () => { if (selectionInfo().ok) send({ type: 'play', ids: [...ui.selected] }); },
  hint: () => {
    const moves = legalMoves(V.hand, V.lastPlay ? V.lastPlay.combos : null);
    if (!moves.length) { toast("Nothing in your hand beats that. Pass."); return; }
    const key = V.round + ':' + (V.lastActions || []).map(a => a && a.act).join(',');
    if (ui.hint.key !== key) ui.hint = { key, i: 0 };
    const m = moves[ui.hint.i % moves.length];
    ui.hint.i++;
    ui.selected = new Set(m.ids);
    refreshSelection();
  },
  hideResult: () => { ui.resultHidden = true; render(); },
  showResult: () => { ui.resultHidden = false; render(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const h = handlers[el.dataset.act];
  if (h) h(el.dataset.arg, el);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  if (kind === 'code') {
    const c = ($('codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c) location.href = location.pathname + '?room=' + c;
    return;
  }
  const inp = $('nameInput');
  myName = cleanName(inp.value || inp.placeholder.replace(/^.*e\.g\. |\)$/g, ''));
  localStorage.setItem('ddz_name', myName);
  if (kind === 'create') {
    const code = rid(6);
    history.replaceState(null, '', '?room=' + code);
    iceReady.then(() => startHost(code, createState(code, { cid: myCid, name: myName }), { fresh: true }));
  } else if (kind === 'join') iceReady.then(() => startGuest(roomCode));
});
document.addEventListener('keydown', e => {
  if (!V || V.phase !== 'playing' || e.target.tagName === 'INPUT') return;
  if (e.key === 'Enter') handlers.play();
  else if (e.key === 'h' || e.key === 'H') handlers.hint();
  else if ((e.key === 'p' || e.key === 'P' || e.key === ' ') && V.turn === V.me && V.lastPlay) { e.preventDefault(); handlers.pass(); }
  else if (e.key === 'Escape') handlers.clear();
});
window.addEventListener('beforeunload', () => { try { peer && peer.destroy(); } catch (e) {} });

/* ============================================================================
   6. BOOT
   ========================================================================== */
(function boot() {
  if (typeof Peer === 'undefined') {
    $('app').innerHTML = shell(`<h2 class="text-xl font-bold mb-2">Couldn't load the multiplayer library</h2><p class="text-slate-300">Check your internet connection (or ad-blocker) and reload.</p>`);
    return;
  }
  // show the full-screen "connecting" view until the first game state arrives
  setStatus = (s, silent) => { ui.status = s; if (!V && s && ui.screen !== 'rejected') ui.screen = 'connecting'; if (!silent) render(); };
  if (!roomCode) { ui.screen = 'landing'; return render(); }
  const rec = loadHost(roomCode);
  if (rec && (!hadCid || rec.cid === myCid)) {
    myCid = rec.cid; sessionStorage.setItem('ddz_cid', myCid);
    return iceReady.then(() => startHost(roomCode, rec.state, { fallbackToGuest: !hadCid }));
  }
  if (myName) return iceReady.then(() => startGuest(roomCode));     // returning player → instant join
  ui.screen = 'join'; render();
})();
</script>
</body>
</html>
